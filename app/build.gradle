plugins {
    id 'com.android.application'
    id 'kotlin-android'
    // id 'kotlin-kapt' // Temporarily disabled to fix duplicate class issues
}

def loadDotEnvValue = { String key ->
    def envFile = rootProject.file('.env')
    if (!envFile.exists()) return null

    def prefix = "${key}="
    def line = envFile.readLines('UTF-8').find { line ->
        def trimmed = line.trim()
        trimmed.startsWith(prefix) && !trimmed.startsWith('#')
    }
    return line == null ? null : line.trim().substring(prefix.length()).trim().replaceAll(/^['"]|['"]$/, '')
}

def creditsAdminCode = System.getenv('EPUB_CREDITS_ADMIN_CODE') ?: loadDotEnvValue('EPUB_CREDITS_ADMIN_CODE') ?: ''
def escapedCreditsAdminCode = creditsAdminCode.replace('\\', '\\\\').replace('"', '\\"')

def versionPropsFile = rootProject.file("version.properties")
def installTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.endsWith("installDebug") || taskName.endsWith("installRelease") ||
            taskName.endsWith("installDebugViaAdb")
}
def shouldBumpVersion = !project.hasProperty('disableAutoVersionBump') &&
        (project.findProperty('bumpVersion') == 'true' || installTaskRequested)

if (shouldBumpVersion && versionPropsFile.exists()) {
    def props = new Properties()
    versionPropsFile.withInputStream { props.load(it) }
    try {
        props['VERSION_CODE'] = ((props['VERSION_CODE'] ?: '1').toInteger() + 1).toString()
        props['BUILD_NUMBER'] = ((props['BUILD_NUMBER'] ?: '1').toInteger() + 1).toString()
        if ((props['BUILD_TYPE'] ?: 'beta') != 'release') {
            props['BETA_BUILD'] = ((props['BETA_BUILD'] ?: '1').toInteger() + 1).toString()
        }
        versionPropsFile.withOutputStream { out ->
            props.store(out, "Auto-bumped on ${new Date()}")
        }
        println "[bumpVersion] Bumped VERSION_CODE to ${props['VERSION_CODE']} (build ${props['BUILD_NUMBER']}) for install task"
    } catch (Exception e) {
        println "[bumpVersion] Failed to bump version: ${e.message}"
    }
}

def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionProps.load(new FileInputStream(versionPropsFile))
}

def major = versionProps['MAJOR_VERSION'] ?: '1'
def minor = versionProps['MINOR_VERSION'] ?: '5'
def patch = versionProps['PATCH_VERSION'] ?: '12'
def buildNumber = versionProps['BUILD_NUMBER'] ?: '1'

// Simple versioning - always use MAJOR.MINOR.PATCH build BUILD_NUMBER format
def computedVersionName = "${major}.${minor}.${patch} build ${buildNumber}"
def computedVersionCode = (versionProps['VERSION_CODE'] ?: '44').toInteger()

android {
    namespace "com.example.epubtranslator"
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.stavk.epubtranslator"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode computedVersionCode
        versionName computedVersionName
        buildConfigField "String", "CREDITS_ADMIN_CODE", "\"${escapedCreditsAdminCode}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    lint {
        baseline = file("lint-baseline.xml")
        checkReleaseBuilds true
        abortOnError false
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }
}

