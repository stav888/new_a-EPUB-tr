plugins {
    id 'com.android.application'
    id 'kotlin-android'
    // id 'kotlin-kapt' // Temporarily disabled to fix duplicate class issues
}

def versionPropsFile = rootProject.file("version.properties")

if (!project.hasProperty('disableAutoVersionBump') && versionPropsFile.exists()) {
    def props = new Properties()
    versionPropsFile.withInputStream { props.load(it) }
    try {
        props['VERSION_CODE'] = ((props['VERSION_CODE'] ?: '1').toInteger() + 1).toString()
        props['BUILD_NUMBER'] = ((props['BUILD_NUMBER'] ?: '1').toInteger() + 1).toString()
        if ((props['BUILD_TYPE'] ?: 'beta') != 'release') {
            props['BETA_BUILD'] = ((props['BETA_BUILD'] ?: '1').toInteger() + 1).toString()
        }
        versionPropsFile.withOutputStream { out ->
            props.store(out, "Auto-bumped on ${new Date()}")
        }
        println "[bumpVersion] Bumped VERSION_CODE to ${props['VERSION_CODE']} (build ${props['BUILD_NUMBER']})"
    } catch (Exception e) {
        println "[bumpVersion] Failed to bump version: ${e.message}"
    }
}

def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionProps.load(new FileInputStream(versionPropsFile))
}

def major = versionProps['MAJOR_VERSION'] ?: '1'
def minor = versionProps['MINOR_VERSION'] ?: '5'
def patch = versionProps['PATCH_VERSION'] ?: '12'
def buildNumber = versionProps['BUILD_NUMBER'] ?: '1'

// Simple versioning - always use MAJOR.MINOR.PATCH build BUILD_NUMBER format
def computedVersionName = "${major}.${minor}.${patch} build ${buildNumber}"
def computedVersionCode = (versionProps['VERSION_CODE'] ?: '44').toInteger()

// API credentials - Replace with your actual RapidAPI key
// DO NOT commit real API keys! Set in local.properties or environment variable instead
def rapidApiKey = System.getenv('RAPIDAPI_KEY') ?: 'MISSING_API_KEY_SET_ENVIRONMENT_VARIABLE'
def rapidApiHost = 'microsoft-translator-text.p.rapidapi.com'

android {
    namespace "com.example.epubtranslator"
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.example.epubtranslator"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode computedVersionCode
        versionName computedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            buildConfigField "String", "RAPIDAPI_KEY", "\"${rapidApiKey}\""
            buildConfigField "String", "RAPIDAPI_HOST", "\"${rapidApiHost}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "RAPIDAPI_KEY", "\"${rapidApiKey}\""
            buildConfigField "String", "RAPIDAPI_HOST", "\"${rapidApiHost}\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    lint {
        baseline = file("lint-baseline.xml")
        checkReleaseBuilds false
        abortOnError false
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }
}

// NOTE: API Keys Configuration
// ============================================
// The RAPIDAPI_KEY and RAPIDAPI_HOST below are SECURITY SENSITIVE
// DO NOT commit real API keys to version control!
//
// To add your API keys:
// 1. Get your API key from RapidAPI (https://rapidapi.com/microsoft-azure-org-microsoft-cognitive-services/api/microsoft-translator-text)
// 2. Replace "your-api-key-here" with your actual RapidAPI key in buildTypes below
// 3. DO NOT commit this file with real keys
// 4. If keys are exposed, regenerate them immediately on RapidAPI dashboard
// ============================================

dependencies {
    // Core Android dependencies
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Material Design 3 - Latest version
    implementation 'com.google.android.material:material:1.11.0'

    // JSoup for HTML parsing
    implementation 'org.jsoup:jsoup:1.17.2'

    // Retrofit for API calls
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines for asynchronous programming
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

