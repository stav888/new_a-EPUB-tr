tasks.register("installDebugViaAdb", Exec) {
    dependsOn("assembleDebug")
    workingDir(rootProject.projectDir)
    commandLine("adb", "install", "-r", file("build/outputs/apk/debug/app-debug.apk").absolutePath)
}

