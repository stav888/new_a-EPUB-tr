    // implementation 'com.google.android.gms:play-services-auth:20.7.0'
    // implementation 'com.google.android.gms:play-services-drive:17.0.0'

    // PDF support - temporarily removed due to dependency issues
    // implementation 'com.github.barteksc:android-pdf-viewer:3.2.0-beta.1'

    // Advanced text processing - temporarily removed
    // implementation 'org.apache.commons:commons-text:1.11.0'

    // Image loading for book covers - re-enabled
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // kapt 'com.github.bumptech.glide:compiler:4.16.0' // Temporarily disabled

    // RecyclerView animations - temporarily removed
    // implementation 'jp.wasabeef:recyclerview-animators:4.0.2'

